title: M365 FullAccess Permission Granted On A Mailbox
id: 5c4fe72e-7284-4ac3-8770-11d43ab911d2
status: experimental
description: |
  Detects FullAccess delegation being granted on an Exchange Online mailbox (Add-MailboxPermission).
  Attackers with admin rights use it to read other mailboxes, such as the CEO's or accounting's.
references:
  - https://learn.microsoft.com/en-us/powershell/module/exchange/add-mailboxpermission
author: Khalid Bahiri
date: 2026-10-01
tags:
  - attack.persistence
  - attack.t1098.002
logsource:
  product: m365
  service: audit
detection:
  selection:
    Operation: 'Add-MailboxPermission'
    Parameters|contains: 'FullAccess'
  condition: selection
falsepositives:
  - Shared mailbox setup or assistant delegation (validate with the requester)
level: medium
