title: Windows Security Event Log Cleared
id: 96a85a9c-c841-4f90-bfa7-9386c29e83b6
status: experimental
description: |
  Detects clearing of the Windows Security event log (event 1102).
  Wiping logs is a classic anti-forensics step after a compromise; it should almost never happen on client workstations.
references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-1102
author: Khalid Bahiri
date: 2026-10-01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Planned log maintenance (rare and should be documented)
level: high
