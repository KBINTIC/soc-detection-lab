title: Member Added To Local Administrators Group
id: d325a8ec-8854-4e2b-8271-3b62c11b2ddf
status: experimental
description: |
  Detects a new member being added to the built-in local Administrators group (event 4732, SID S-1-5-32-544).
  In small businesses users should not be local admins; any addition is worth a look (persistence or privilege escalation).
references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732
author: Khalid Bahiri
date: 2026-10-01
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4732
    TargetSid: 'S-1-5-32-544'
  condition: selection
falsepositives:
  - Planned IT administration (match against your change tickets)
level: medium
