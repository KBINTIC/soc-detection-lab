name: sigma-ci

on:
  push:
  pull_request:

jobs:
  validate-and-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install sigma-cli and backends
        run: pip install -r requirements.txt

      - name: Validate rules (syntax, ATT&CK tags, best practices)
        run: sigma check --fail-on-issues rules/

      - name: Convert rules to Sentinel KQL and Wazuh Lucene
        run: ./scripts/convert.sh

      - name: Publish converted queries
        uses: actions/upload-artifact@v4
        with:
          name: detection-queries
          path: build/
